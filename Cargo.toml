[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri"
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Equipo de Ingeniería ElTransportador <ingenieria@eltransportador.dev>"]
license = "MIT"
repository = "https://github.com/eltransportador/eltransportador"
homepage = "https://eltransportador.dev"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
