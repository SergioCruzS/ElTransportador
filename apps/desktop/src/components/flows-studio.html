<!-- Componente: Pantalla Completa de Estudio y Ejecución de Flujos (apps/desktop/src/components/flows-studio.html) -->
<section class="etp-flows-studio" id="flows-studio-view" aria-label="Estudio de Flujos de API">
  <!-- Menú Lateral Izquierdo de Flujos (Independiente: Fijo, Flotante, Ocultar y Redimensionable) -->
  <aside class="etp-flows-sidebar" id="flows-left-sidebar" aria-label="Menú lateral de flujos">
    <div class="etp-sidebar-header" style="margin:-12px -12px 4px -12px;padding:8px 10px;">
      <strong style="font-size:12.5px;" id="lbl-flows-sidebar-title">Mis Flujos (0)</strong>
      <div style="display:flex;gap:4px;align-items:center;">
        <button type="button" class="etp-btn-xs" id="btn-pin-flows-left-sidebar" data-i18n-title="sidebar.pinTooltip" title="Fijar panel o dejar flotante (auto-ocultar al perder foco)">
          📌 <span id="lbl-flows-left-pin-state" data-i18n="sidebar.pinFixed">Fijo</span>
        </button>
        <button type="button" class="etp-btn-xs" id="btn-hide-flows-left-sidebar" data-i18n-title="sidebar.hideTooltip" title="Ocultar panel lateral">
          <span data-i18n="sidebar.hide">◀ Ocultar</span>
        </button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
      <span id="lbl-flows-section-badge" class="etp-search-badge" style="font-size:11px;font-weight:600;color:var(--accent-primary);">☰ Modo Básico</span>
      <button type="button" class="etp-btn etp-btn-primary" id="btn-create-custom-flow" style="height:28px;padding:0 10px;font-size:12px;" data-i18n="flows.btnNewFlow">+ Nuevo Flujo</button>
    </div>
    <div class="etp-response-search-shell" style="flex:0 0 32px;">
      <span class="etp-search-icon">🔍</span>
      <input type="search" id="flows-search-input" class="etp-response-search-input" data-i18n-placeholder="flows.searchFlowsPlaceholder" placeholder="Filtrar flujos..." />
    </div>
    <div id="flows-sidebar-list" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
  </aside>

  <div class="etp-sidebar-resizer" id="flows-left-sidebar-resizer" title="Arrastra con el mouse para redimensionar el menú izquierdo de flujos"></div>

  <!-- Área Principal del Estudio de Flujos -->
  <div class="etp-flows-main" id="flows-studio-main-content"></div>
</section>
